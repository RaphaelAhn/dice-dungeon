name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포는 한 번에 하나만. 연속 푸시 시 중간 빌드는 취소하되 진행 중인 배포는 끝까지 보낸다.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc -b 가 포함돼 있어 타입 에러가 나면 여기서 배포가 멈춘다. 의도된 안전장치.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
